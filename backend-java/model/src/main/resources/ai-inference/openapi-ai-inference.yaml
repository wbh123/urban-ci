openapi: 3.0.3
info:
  title: UrbanSafe Priority 人工智能推理与编排接口
  description: |
    人工智能辅助识别公共接口。前端只调用 Spring Boot，不直接访问 FastAPI、Dify 或在线模型供应商。

    约定：
    - 输入图片必须来自已登记的 file_asset，并可追溯到巡检任务/记录、楼栋和小区；
    - 通用任务通过 AiOrchestrationService 与 AiProviderRouter 选择提供者；
    - 巡检高精度视觉采用显式 Dify 优先、本地 ACCURACY 兜底策略，故障转移必须可审计，不属于静默降级；
    - REAL 仅在模型状态为 APPROVED 时可用；
    - ACCURACY 使用异步任务，HTTP 202 只表示已入队，不表示模型已完成；
    - 供应商响应必须转换为统一结构并完成后端校验；
    - recommendations 仅为辅助建议，不能覆盖规则评分、人工结论和正式报告；
    - rawResponseReference 只保存受控引用，不向前端返回完整供应商原始响应；
    - 人工智能结果必须经过人工复核后，才可能成为评分证据。
  version: 7.2.0

paths:
  /api/v1/ai-models:
    get:
      operationId: listAiModels
      summary: 查询可用人工智能模型目录
      description: 合并数据库模型登记与实际运行状态，前端不得直接访问提供者服务。
      x-apifox-folder: 人工智能推理
      x-apifox-status: tested
      responses:
        '200':
          description: 模型目录
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/AiModelCatalogItem' }
                  error: { nullable: true }
                  requestId: { type: string }
                  timestamp: { type: string, format: date-time }

  /api/v1/ai-inferences:
    post:
      operationId: createAiInference
      summary: 创建人工智能推理、工作流或异步高精度视觉任务
      description: |
        普通 FAST/PRECISION 任务保持既有创建语义；当 inferenceProfile=ACCURACY 时仅创建持久化
        execution task 并立即返回 HTTP 202，浏览器通过 execution 查询接口进行短轮询。
      x-apifox-folder: 人工智能推理
      x-apifox-status: tested
      x-apifox-name: 创建人工智能推理任务
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiInferenceCreateRequest'
            examples:
              accuracyManual:
                value:
                  assetId: 44444444-4444-4444-4444-444444444444
                  mode: REAL
                  modelId: AI-VISION-LOCAL-001
                  providerCode: FAST_API
                  capabilityType: VISION_INFERENCE
                  inferenceProfile: ACCURACY
                  triggerType: MANUAL_SINGLE
                  idempotencyKey: inspection-image-accuracy
              fastApiMock:
                value:
                  assetId: 44444444-4444-4444-4444-444444444444
                  mode: MOCK
                  modelId: AI-DEFECT-MOCK-001
                  providerCode: FAST_API
                  capabilityType: VISION_INFERENCE
                  idempotencyKey: inspection-image-fast-api
              difyWorkflow:
                value:
                  assetId: 44444444-4444-4444-4444-444444444444
                  mode: REAL
                  modelId: AI-DIFY-WORKFLOW-001
                  providerCode: DIFY
                  capabilityType: WORKFLOW
                  prompt: 分析图片中的建筑表观病害并给出补拍建议
                  idempotencyKey: inspection-image-dify
      responses:
        '201':
          description: 已创建同步/普通推理任务
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/AiInferenceDetail' }
                  error: { nullable: true }
                  requestId: { type: string }
                  timestamp: { type: string, format: date-time }
        '202':
          description: ACCURACY 高精度视觉任务已进入后台队列
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/AiAsyncInferenceSubmission' }
                  error: { nullable: true }
                  requestId: { type: string }
                  timestamp: { type: string, format: date-time }
        '400': { description: 能力类型、输入参数或输出校验失败 }
        '404': { description: 图片资产、模型或提供者不存在 }
        '409': { description: 模型未批准或存在活跃重复任务 }
        '422': { description: 图片可读取但不适用于当前能力 }
        '502': { description: 提供者响应结构无效 }
        '503': { description: 提供者禁用、未配置或不可用 }
        '504': { description: 提供者调用超时 }
    get:
      operationId: listAiInferences
      summary: 查询人工智能任务
      description: 按状态、模式、模型、提供者、能力、图片和业务追溯对象筛选。
      x-apifox-folder: 人工智能推理
      x-apifox-status: tested
      x-apifox-name: 查询人工智能推理任务
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, RUNNING, SUCCEEDED, FAILED, REJECTED, CANCELLED]
        - name: mode
          in: query
          schema: { type: string, enum: [MOCK, REAL] }
        - name: modelId
          in: query
          schema: { type: string }
        - name: providerCode
          in: query
          schema: { $ref: '#/components/schemas/AiProviderCode' }
        - name: capabilityType
          in: query
          schema: { $ref: '#/components/schemas/AiCapabilityType' }
        - name: assetId
          in: query
          schema: { type: string, format: uuid }
        - name: inspectionTaskId
          in: query
          schema: { type: string, format: uuid }
        - name: inspectionRecordId
          in: query
          schema: { type: string, format: uuid }
        - name: buildingId
          in: query
          schema: { type: string, format: uuid }
        - name: communityId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200': { description: 人工智能任务分页列表 }

  /api/v1/ai-inference-executions:
    get:
      operationId: listAiInferenceExecutions
      summary: 按巡检任务查询图片异步分析执行状态
      description: 用于巡检端和管理端恢复历史排队/运行状态与 Dify/本地路由审计。
      x-apifox-folder: 人工智能推理
      x-apifox-status: testing
      parameters:
        - name: inspectionTaskId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 执行任务列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AiInferenceExecution' }
                  error: { nullable: true }
                  requestId: { type: string }
                  timestamp: { type: string, format: date-time }

  /api/v1/ai-inference-executions/{taskId}:
    get:
      operationId: getAiInferenceExecution
      summary: 查询异步高精度视觉执行状态
      description: 每次调用均为短请求；前端可约每 2 秒轮询一次，不建立长连接。
      x-apifox-folder: 人工智能推理
      x-apifox-status: testing
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 执行任务详情
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/AiInferenceExecution' }
                  error: { nullable: true }
                  requestId: { type: string }
                  timestamp: { type: string, format: date-time }
        '404': { description: 执行任务不存在 }

  /api/v1/ai-inferences/{inferenceId}:
    get:
      operationId: getAiInference
      summary: 查询人工智能任务详情
      description: 返回提供者、模型/工作流、统一结构化结果、错误、追溯关系和人工复核状态。
      x-apifox-folder: 人工智能推理
      x-apifox-status: tested
      x-apifox-name: 查询人工智能任务详情
      parameters:
        - name: inferenceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: 人工智能任务详情 }
        '404': { description: 人工智能任务不存在 }

  /api/v1/ai-inferences/{inferenceId}/retry:
    post:
      operationId: retryAiInference
      summary: 重试失败人工智能任务
      description: |
        只允许对 FAILED 任务重试；创建新的 attemptNo 并保留历史失败记录。
        默认沿用原提供者与能力；巡检高精度视觉故障转移遵循显式 VisionAnalysisOrchestrator 策略。
      x-apifox-folder: 人工智能推理
      x-apifox-status: tested
      x-apifox-name: 重试人工智能任务
      parameters:
        - name: inferenceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiInferenceRetryRequest'
      responses:
        '201': { description: 已创建重试任务 }
        '409': { description: 任务状态不可重试 }

  /api/v1/ai-intelligent-analysis:
    post:
      operationId: runIntelligentAnalysis
      summary: Spring AI 智能综合分析
      description: |
        以 Spring AI 作为编排层，DeepSeek 推理 + Tool Calling（本地视觉 / Dify 工作流 /
        只读业务工具）。请求只允许提交业务标识与问题，不允许提交 apiKey/baseUrl/systemPrompt
        或任意工具名；系统提示、工具集与安全上下文一律由后端决定。
      x-apifox-folder: 人工智能推理
      x-apifox-status: testing
      x-apifox-name: 智能综合分析
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiIntelligentAnalysisRequest'
      responses:
        '200': { description: 返回执行轨迹与辅助答案 }
        '400': { description: 请求参数无效 }
        '503': { description: Spring AI / DeepSeek 未配置 }

  /api/v1/ai-intelligent-analysis/executions/{executionId}:
    get:
      operationId: getIntelligentAnalysisExecution
      summary: 查询智能综合分析执行轨迹
      x-apifox-folder: 人工智能推理
      x-apifox-status: testing
      x-apifox-name: 智能综合分析执行轨迹
      parameters:
        - name: executionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: 返回执行详情与步骤 }

components:
  schemas:
    AiProviderCode:
      type: string
      enum: [FAST_API, DIFY, SPRING_AI]

    AiInferenceProfile:
      type: string
      enum: [FAST, PRECISION, ACCURACY]

    AiAnalysisTriggerType:
      type: string
      enum: [UPLOAD_AUTO, MANUAL_SINGLE, MANUAL_BATCH]

    AiExecutionStatus:
      type: string
      enum: [PENDING, READY, RUNNING, RETRY_WAIT, SUCCEEDED, FAILED, REJECTED, CANCELLED]

    AiAsyncInferenceSubmission:
      type: object
      required: [taskId, status, inferenceProfile, assetId]
      properties:
        taskId: { type: string, format: uuid }
        status: { type: string, enum: [PENDING] }
        inferenceProfile: { type: string, enum: [ACCURACY] }
        triggerType: { $ref: '#/components/schemas/AiAnalysisTriggerType' }
        assetId: { type: string, format: uuid }

    AiInferenceExecution:
      type: object
      properties:
        taskId: { type: string, format: uuid }
        assetId: { type: string, format: uuid, nullable: true }
        status: { $ref: '#/components/schemas/AiExecutionStatus' }
        inferenceId: { type: string, format: uuid, nullable: true }
        attemptCount: { type: integer }
        maxAttempts: { type: integer }
        errorCode: { type: string, nullable: true }
        errorMessage: { type: string, nullable: true }
        triggerType:
          allOf:
            - $ref: '#/components/schemas/AiAnalysisTriggerType'
          nullable: true
        preferredProvider: { type: string, nullable: true }
        actualProvider: { type: string, nullable: true }
        orchestrationMode:
          type: string
          enum: [DIFY_PREFERRED, SPRING_AI_LOCAL]
          nullable: true
        fallback: { type: boolean, default: false }
        fallbackReason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time, nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time, nullable: true }

    AiIntelligentAnalysisRequest:
      type: object
      required:
        - question
      properties:
        businessType:
          type: string
          description: 业务类型，例如 BUILDING / AI_INFERENCE
        businessId:
          type: string
          format: uuid
        question:
          type: string
        context:
          type: object
          description: 后端白名单上下文（仅读取 assetId 等已知键，忽略未知键）
          additionalProperties: true

    AiAgentExecutionStep:
      type: object
      properties:
        seqNo: { type: integer }
        type: { type: string, enum: [TOOL, LLM] }
        toolName: { type: string }
        provider: { type: string }
        status: { type: string, enum: [WAITING, RUNNING, SUCCEEDED, FAILED, SKIPPED] }
        durationMs: { type: integer, nullable: true }
        errorCode: { type: string, nullable: true }
        detail: { type: string, nullable: true }

    AiAgentExecutionResult:
      type: object
      properties:
        executionId: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, RUNNING, SUCCEEDED, PARTIAL_SUCCEEDED, FAILED] }
        answer: { type: string }
        steps:
          type: array
          items: { $ref: '#/components/schemas/AiAgentExecutionStep' }
        durationMs: { type: integer }
        modelCode: { type: string, nullable: true }

    AiCapabilityType:
      type: string
      enum: [VISION_INFERENCE, WORKFLOW, TEXT_GENERATION]

    AiModelDeploymentStage:
      type: string
      enum: [VALIDATING, DEMO, SHADOW, ACTIVE, SUSPENDED]

    AiModelCatalogItem:
      type: object
      required:
        - modelId
        - modelName
        - modelVersion
        - mode
        - status
        - deploymentStage
        - formalEvidenceEnabled
        - runtimeReady
        - selectable
      properties:
        modelId: { type: string }
        modelName: { type: string }
        modelVersion: { type: string }
        modelType: { type: string }
        mode: { type: string, enum: [MOCK, REAL] }
        status: { type: string }
        license: { type: string }
        supportedClasses: { type: array, items: { type: string } }
        limitations: { type: array, items: { type: string } }
        deploymentStage: { $ref: '#/components/schemas/AiModelDeploymentStage' }
        formalEvidenceEnabled: { type: boolean }
        runtimeReady: { type: boolean }
        executionProvider: { type: string, nullable: true }
        deviceId: { type: integer, nullable: true }
        selectable: { type: boolean }
        runtimeErrorCode: { type: string, nullable: true }
        runtimeErrorMessage: { type: string, nullable: true }

    AiInferenceCreateRequest:
      type: object
      required: [assetId, mode, modelId]
      properties:
        assetId:
          type: string
          format: uuid
          description: 已登记且具有权限的巡检图片资产编号
        mode:
          type: string
          enum: [MOCK, REAL]
        modelId:
          type: string
          minLength: 1
          description: 业务模型或工作流登记编号
        providerCode:
          $ref: '#/components/schemas/AiProviderCode'
        capabilityType:
          allOf:
            - $ref: '#/components/schemas/AiCapabilityType'
          default: VISION_INFERENCE
        inferenceProfile:
          $ref: '#/components/schemas/AiInferenceProfile'
        triggerType:
          allOf:
            - $ref: '#/components/schemas/AiAnalysisTriggerType'
          description: ACCURACY 后台任务的触发来源；省略时默认为 MANUAL_SINGLE。
        prompt:
          type: string
          maxLength: 2000
          description: 可选受控任务说明；不得包含密钥或无关居民隐私
        idempotencyKey:
          type: string
          maxLength: 128
          description: 可选客户端幂等键

    AiInferenceRetryRequest:
      type: object
      properties:
        modelId:
          type: string
          description: 可选，指定另一个已批准模型；提供者与能力默认沿用原任务

    AiAssessmentEligibility:
      type: string
      description: 人工智能结果进入第四阶段评分前的资格。
      enum: [DEMO_ONLY, REVIEW_REQUIRED, ELIGIBLE, EXCLUDED]

    AiEvidenceReliability:
      type: string
      enum: [SIMULATED, MODEL_UNREVIEWED, PROFESSIONAL_REVIEWED, HUMAN_REJECTED, NOT_USABLE, UNKNOWN_SOURCE]

    AiInferenceSummary:
      type: object
      properties:
        inferenceId: { type: string, format: uuid }
        requestCode: { type: string }
        status:
          type: string
          enum: [PENDING, RUNNING, SUCCEEDED, FAILED, REJECTED, CANCELLED]
        mode: { type: string, enum: [MOCK, REAL] }
        providerCode: { $ref: '#/components/schemas/AiProviderCode' }
        capabilityType: { $ref: '#/components/schemas/AiCapabilityType' }
        modelId: { type: string }
        modelVersion: { type: string }
        workflowCode: { type: string, nullable: true }
        workflowVersion: { type: string, nullable: true }
        assetId: { type: string, format: uuid }
        resultAvailable: { type: boolean }
        applicability:
          type: string
          enum: [APPLICABLE, NO_DEFECT_FOUND, LOW_QUALITY, NOT_APPLICABLE, INVALID_IMAGE]
        qualityStatus: { type: string }
        detectionCount: { type: integer }
        durationMs: { type: integer, format: int64 }
        confidence: { type: number, format: double, minimum: 0, maximum: 1, nullable: true }
        errorCode: { type: string, nullable: true }
        errorMessage: { type: string, nullable: true }
        reviewStatus:
          type: string
          enum: [UNREVIEWED, CONFIRMED, CORRECTED, REJECTED]
        fallbackUsed: { type: boolean, default: false }
        fallbackProviderCode: { type: string, nullable: true }
        fallbackReason: { type: string, nullable: true }
        assessmentEligibility: { $ref: '#/components/schemas/AiAssessmentEligibility' }
        eligibleForFormalAssessment: { type: boolean }
        evidenceReliability: { $ref: '#/components/schemas/AiEvidenceReliability' }
        assessmentNote: { type: string }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }

    AiInferenceDetail:
      allOf:
        - $ref: '#/components/schemas/AiInferenceSummary'
        - type: object
          properties:
            inspectionTaskId: { type: string, format: uuid, nullable: true }
            inspectionRecordId: { type: string, format: uuid, nullable: true }
            buildingId: { type: string, format: uuid }
            communityId: { type: string, format: uuid }
            requestedBy: { type: string, format: uuid }
            attemptNo: { type: integer }
            imageWidth: { type: integer, nullable: true }
            imageHeight: { type: integer, nullable: true }
            detections:
              type: array
              items: { $ref: '#/components/schemas/AiDetectionItem' }
            structuredResult: { $ref: '#/components/schemas/AiStructuredResult' }
            warnings:
              type: array
              items: { type: string }
            rawResponseReference:
              type: string
              nullable: true
              description: 受控审计引用，不是完整供应商响应
            disclaimer: { type: string }

    AiStructuredResult:
      type: object
      required:
        - requestId
        - providerCode
        - modelCode
        - capabilityType
        - status
        - summary
        - detections
        - riskSignals
        - recommendations
        - warnings
        - durationMs
      properties:
        requestId: { type: string }
        providerCode: { $ref: '#/components/schemas/AiProviderCode' }
        modelCode: { type: string }
        modelVersion: { type: string, nullable: true }
        capabilityType: { $ref: '#/components/schemas/AiCapabilityType' }
        status: { type: string, enum: [SUCCEEDED, REJECTED] }
        summary: { type: string, minLength: 1 }
        detections:
          type: array
          items: { $ref: '#/components/schemas/AiDetectionItem' }
        riskSignals:
          type: array
          items: { $ref: '#/components/schemas/AiRiskSignal' }
        recommendations:
          type: array
          items: { type: string }
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
          nullable: true
        warnings:
          type: array
          items: { type: string }
        rawResponseReference: { type: string, nullable: true }
        durationMs: { type: integer, format: int64, minimum: 0 }

    AiRiskSignal:
      type: object
      properties:
        code: { type: string }
        level: { type: string }
        description: { type: string }
        confidence: { type: number, format: double, minimum: 0, maximum: 1, nullable: true }

    AiDetectionItem:
      type: object
      properties:
        sequence: { type: integer }
        classCode: { type: string }
        className: { type: string }
        confidence: { type: number, format: double, minimum: 0, maximum: 1 }
        boundingBox: { $ref: '#/components/schemas/AiBoundingBox' }
        segmentation:
          allOf:
            - $ref: '#/components/schemas/AiSegmentation'
          nullable: true
        trustLevel:
          type: string
          enum: [HIGH, MEDIUM, LOW]
          nullable: true
        trustReasons:
          type: array
          items: { type: string }
        diagnostics:
          type: object
          additionalProperties: true

    AiSegmentation:
      type: object
      properties:
        type: { type: string, enum: [POLYGON] }
        points:
          type: array
          description: 轮廓点序列 [[x, y], ...]，坐标归一化 0~1
          items:
            type: array
            items: { type: number, format: double, minimum: 0, maximum: 1 }

    AiBoundingBox:
      type: object
      properties:
        x: { type: number, format: double, minimum: 0, maximum: 1 }
        y: { type: number, format: double, minimum: 0, maximum: 1 }
        width: { type: number, format: double, exclusiveMinimum: 0, maximum: 1 }
