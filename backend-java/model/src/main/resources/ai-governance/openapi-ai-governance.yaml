openapi: 3.0.3
info:
  title: UrbanSafe Priority 人工智能治理接口
  version: 1.4.0
  description: |
    面向系统管理员的人工智能提供者配置状态、缓存真实运行状态、近七日任务统计、业务开关与默认视觉模型。
    接口不返回密钥、基础地址、模型权重路径、完整供应商响应或内部堆栈。
paths:
  /api/v1/ai-governance/status:
    get:
      operationId: getAiGovernanceStatus
      summary: 查询人工智能治理运行状态
      description: |
        只允许 ADMIN 调用。CONFIGURED 仅表示配置完整；runtimeStatus 来自后端缓存探测，
        页面不会把空值解释为可用状态。
      tags: [AiGovernance]
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiGovernanceStatusSuccessResponse'
        '401': { description: 未登录 }
        '403': { description: 非管理员无权访问 }
  /api/v1/ai-governance/automation-settings:
    get:
      operationId: getAiAutomationSettings
      summary: 查询人工智能业务开关与默认视觉模型
      description: 只允许 ADMIN 调用；不返回任何 Provider 密钥或模型私有配置。
      tags: [AiAutomationSettings]
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiAutomationSettingsSuccessResponse'
        '401': { description: 未登录 }
        '403': { description: 非管理员无权访问 }
    put:
      operationId: updateAiAutomationSettings
      summary: 更新人工智能业务开关与默认视觉模型
      description: |
        只允许 ADMIN 调用。modelId 可选；未提供时保持当前默认视觉模型。
        更换默认视觉模型时要求模型业务状态为 APPROVED，且 FastAPI 真实运行时已加载并可选。
        开启视觉自动识别前要求 FastAPI 本地视觉提供者及当前默认模型已就绪；
        开启智能工作流前要求 Dify WORKFLOW 能力已配置；开启知识问答前要求 Spring AI / DeepSeek 文本能力已配置。
        这些设置不会修改第三方 API Key、Provider 环境变量、模型权重或正式评分资格。
      tags: [AiAutomationSettings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiAutomationSettingsUpdateRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiAutomationSettingsSuccessResponse'
        '400': { description: 请求值无效 }
        '401': { description: 未登录 }
        '403': { description: 非管理员无权访问 }
        '409': { description: 对应人工智能能力或所选模型运行时尚未就绪 }
components:
  schemas:
    AiProviderMetrics:
      type: object
      required: [totalTasks, succeededTasks, failedTasks, reviewedTasks, pendingReviewTasks, averageDurationMs, successRate]
      properties:
        totalTasks: { type: integer, format: int64 }
        succeededTasks: { type: integer, format: int64 }
        failedTasks: { type: integer, format: int64 }
        reviewedTasks: { type: integer, format: int64 }
        pendingReviewTasks: { type: integer, format: int64 }
        averageDurationMs: { type: integer, format: int64 }
        successRate: { type: number, format: double, minimum: 0, maximum: 100 }
    AiProviderStatus:
      type: object
      required: [providerCode, enabled, configured, configurationStatus, runtimeStatus, connectivityStatus, capabilities, defaultFor, metrics7d]
      properties:
        providerCode: { type: string }
        enabled: { type: boolean }
        configured: { type: boolean }
        configurationStatus:
          type: string
          description: DISABLED、NOT_CONFIGURED 或 CONFIGURED
        runtimeStatus:
          type: string
          description: READY、DEGRADED、UNCONFIGURED、AUTH_ERROR、UNAVAILABLE、DISABLED 或 UNKNOWN
        connectivityStatus:
          type: string
          description: READY 时为 CONNECTED；其他状态按后端探测语义返回
        capabilities:
          type: array
          items: { type: string }
        defaultFor:
          type: array
          items: { type: string }
        metrics7d:
          $ref: '#/components/schemas/AiProviderMetrics'
    AiGovernanceStatus:
      type: object
      required: [generatedAt, statisticsWindow, providers, total7d, unassignedLegacyTasks7d, healthSemantics, disclaimer]
      properties:
        generatedAt: { type: string, format: date-time }
        statisticsWindow:
          type: string
          description: 当前固定为 LAST_7_DAYS
        providers:
          type: array
          items: { $ref: '#/components/schemas/AiProviderStatus' }
        total7d:
          $ref: '#/components/schemas/AiProviderMetrics'
        unassignedLegacyTasks7d: { type: integer, format: int64 }
        healthSemantics: { type: string }
        disclaimer: { type: string }
    AiAutomationSettingsView:
      type: object
      required: [autoInferenceOnUpload, intelligentWorkflowEnabled, knowledgeQaEnabled, modelId, providerCode, capabilityType]
      properties:
        autoInferenceOnUpload:
          type: boolean
          description: 成功上传巡检任务图片后是否自动执行本地视觉识别
        intelligentWorkflowEnabled:
          type: boolean
          description: 是否允许 Spring AI 编排使用 Dify 智能工作流工具
        knowledgeQaEnabled:
          type: boolean
          description: 是否允许知识问答以及 Spring AI 编排使用知识检索工具
        modelId:
          type: string
          description: 当前持久化的默认视觉模型登记编号；迁移初始值为 AI-VISION-LOCAL-001
        providerCode:
          type: string
          description: 当前固定为 FAST_API
        capabilityType:
          type: string
          description: 当前固定为 VISION_INFERENCE
        updatedAt:
          type: string
          format: date-time
          nullable: true
    AiAutomationSettingsUpdateRequest:
      type: object
      required: [autoInferenceOnUpload, intelligentWorkflowEnabled, knowledgeQaEnabled]
      properties:
        autoInferenceOnUpload: { type: boolean }
        intelligentWorkflowEnabled: { type: boolean }
        knowledgeQaEnabled: { type: boolean }
        modelId:
          type: string
          minLength: 1
          maxLength: 128
          nullable: true
          description: 可选的新默认视觉模型编号；为空时保持当前默认模型，切换前必须通过真实运行时可用性校验
    AiGovernanceStatusSuccessResponse:
      type: object
      required: [success, data, requestId, timestamp]
      properties:
        success: { type: boolean }
        data: { $ref: '#/components/schemas/AiGovernanceStatus' }
        error: { nullable: true }
        requestId: { type: string }
        timestamp: { type: string, format: date-time }
    AiAutomationSettingsSuccessResponse:
      type: object
      required: [success, data, requestId, timestamp]
      properties:
        success: { type: boolean }
        data: { $ref: '#/components/schemas/AiAutomationSettingsView' }
        error: { nullable: true }
        requestId: { type: string }
        timestamp: { type: string, format: date-time }
