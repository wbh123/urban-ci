openapi: 3.0.3
info:
  title: UrbanSafe Priority 认证登录接口
  description: |
    用户登录与退出接口。

    登录接口无需携带认证信息。ApiFox 调试流程在登录成功后执行后置操作，
    从响应体 `data.accessToken` 提取环境变量 `accessToken`，其余受保护接口
    统一发送 `Authorization: Bearer {{accessToken}}`。
  version: 1.0.1
paths:
  /api/v1/auth/login:
    post:
      tags:
        - AuthLogin
      operationId: login
      summary: 用户登录
      description: |
        使用用户名和密码登录并返回访问令牌。该接口无需鉴权。

        ApiFox 后置操作从成功响应的 `data.accessToken` 提取环境变量
        `accessToken`，供后续受保护接口作为 Bearer Token 使用。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: admin
              password: urban_safe_admin_password
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessResponse'
              example:
                success: true
                data:
                  accessToken: eyJ...sample
                  tokenType: Bearer
                  expiresInSeconds: 7200
                  user:
                    id: 00000000-0000-0000-0000-000000000001
                    username: admin
                    realName: 开发管理员
                    roles:
                      - ADMIN
                error: null
                requestId: apifox-login-001
                timestamp: '2026-07-14T14:00:00+08:00'
        '400':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '../common-response/openapi-common-response.yaml#/components/schemas/ErrorResponse'
        '401':
          description: 用户名或密码错误
          content:
            application/json:
              schema:
                $ref: '../common-response/openapi-common-response.yaml#/components/schemas/ErrorResponse'
        '403':
          description: 账号停用或锁定
          content:
            application/json:
              schema:
                $ref: '../common-response/openapi-common-response.yaml#/components/schemas/ErrorResponse'
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '../common-response/openapi-common-response.yaml#/components/schemas/ErrorResponse'

  /api/v1/auth/logout:
    post:
      tags:
        - AuthLogin
      operationId: logout
      summary: 用户退出
      description: |
        退出登录，客户端删除令牌。该接口需要 JWT Bearer Token，ApiFox
        统一使用环境变量 `accessToken`，即
        `Authorization: Bearer {{accessToken}}`。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 退出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccessResponse'
        '401':
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '../common-response/openapi-common-response.yaml#/components/schemas/ErrorResponse'

components:
  schemas:
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: 用户名
          example: admin
        password:
          type: string
          minLength: 1
          maxLength: 128
          description: 密码
          example: urban_safe_admin_password

    LoginUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: 用户唯一标识
        username:
          type: string
          description: 用户名
        realName:
          type: string
          description: 真实姓名
        roles:
          type: array
          description: 角色列表
          items:
            type: string
            description: 角色编码

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: |
            访问令牌。ApiFox 后置操作从 `data.accessToken` 提取此值并保存到
            环境变量 `accessToken`。
        tokenType:
          type: string
          description: 令牌类型
          example: Bearer
        expiresInSeconds:
          type: integer
          description: 令牌有效期（秒）
        user:
          $ref: '#/components/schemas/LoginUser'

    LogoutResponse:
      type: object
      properties:
        message:
          type: string
          description: 退出成功消息
          example: 退出成功

    LoginSuccessResponse:
      allOf:
        - $ref: '../common-response/openapi-common-response.yaml#/components/schemas/ApiResponseMetadata'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/LoginResponse'
            error:
              type: object
              nullable: true
              description: 成功响应固定为空

    LogoutSuccessResponse:
      allOf:
        - $ref: '../common-response/openapi-common-response.yaml#/components/schemas/ApiResponseMetadata'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/LogoutResponse'
            error:
              type: object
              nullable: true
              description: 成功响应固定为空

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT Bearer Token 认证。ApiFox 使用登录后提取的环境变量
        `accessToken`，发送 `Authorization: Bearer {{accessToken}}`。
