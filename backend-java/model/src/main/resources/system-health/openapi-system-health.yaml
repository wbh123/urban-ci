openapi: 3.0.3
info:
  title: UrbanSafe Priority 系统健康检查接口
  version: 1.0.0
tags:
  - name: SystemHealth
    description: 系统健康检查
paths:
  /system/health:
    get:
      operationId: getSystemHealth
      tags:
        - SystemHealth
      summary: 获取业务服务健康状态
      security: []
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemHealthResponse'
        '503':
          description: 服务或关键依赖不可用
          content:
            application/json:
              schema:
                $ref: '../common-response/openapi-common-response.yaml#/components/schemas/ErrorResponse'
components:
  schemas:
    SystemHealthData:
      type: object
      required:
        - service
        - status
        - version
      properties:
        service:
          type: string
          example: urban-safe-priority-server
        status:
          type: string
          enum:
            - UP
            - DEGRADED
            - DOWN
        version:
          type: string
          example: 0.1.0

    SystemHealthResponse:
      allOf:
        - $ref: '../common-response/openapi-common-response.yaml#/components/schemas/ApiResponseMetadata'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/SystemHealthData'
            error:
              type: object
              nullable: true
              description: 成功响应固定为空
