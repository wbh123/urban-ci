server:
  port: ${URBAN_SAFE_SERVER_PORT}

spring:
  application:
    name: urban-safe-priority
  profiles:
    active: local
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${URBAN_SAFE_DB_HOST}:${URBAN_SAFE_DB_PORT}/${URBAN_SAFE_DB_NAME}
    username: ${URBAN_SAFE_DB_USER}
    password: ${URBAN_SAFE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: ${URBAN_SAFE_STORAGE_MAX_IMAGE_SIZE_BYTES}B
      max-request-size: ${URBAN_SAFE_STORAGE_MAX_REQUEST_SIZE_BYTES}B
  ai:
    model:
      chat: ${URBAN_SAFE_SPRING_AI_MODEL_CHAT:none}
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      api-key: ${URBAN_SAFE_SPRING_AI_API_KEY:}
      base-url: ${URBAN_SAFE_SPRING_AI_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${URBAN_SAFE_SPRING_AI_MODEL:deepseek-v4-flash}

mybatis-plus:
  mapper-locations: classpath*:mappers/**/*.xml
  type-aliases-package: org.urbansafe.priority
  type-handlers-package: org.urbansafe.priority.persistence.typehandler
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true
  global-config:
    banner: false
    db-config:
      id-type: input
      logic-delete-field: deletedAt
      logic-not-delete-value: "null"
      logic-delete-value: "now()"

management:
  endpoints:
    web:
      exposure:
        include: health,info

urban-safe:
  auth:
    jwt:
      issuer: ${URBAN_SAFE_AUTH_JWT_ISSUER}
      audience: ${URBAN_SAFE_AUTH_JWT_AUDIENCE}
      secret: ${URBAN_SAFE_AUTH_JWT_SECRET}
      access-token-ttl-seconds: ${URBAN_SAFE_AUTH_ACCESS_TOKEN_TTL_SECONDS}
    bootstrap-admin:
      enabled: ${URBAN_SAFE_BOOTSTRAP_ADMIN_ENABLED}
      username: ${URBAN_SAFE_BOOTSTRAP_ADMIN_USERNAME}
      password: ${URBAN_SAFE_BOOTSTRAP_ADMIN_PASSWORD}
      real-name: ${URBAN_SAFE_BOOTSTRAP_ADMIN_REAL_NAME}
  web:
    cors:
      allowed-origins: ${URBAN_SAFE_CORS_ALLOWED_ORIGINS}
      allowed-methods: ${URBAN_SAFE_CORS_ALLOWED_METHODS}
      allowed-headers: ${URBAN_SAFE_CORS_ALLOWED_HEADERS}
      allow-credentials: ${URBAN_SAFE_CORS_ALLOW_CREDENTIALS}
  map:
    enabled: ${URBAN_SAFE_MAP_ENABLED}
    provider: ${URBAN_SAFE_MAP_PROVIDER}
    default-center-longitude: ${URBAN_SAFE_MAP_DEFAULT_CENTER_LONGITUDE}
    default-center-latitude: ${URBAN_SAFE_MAP_DEFAULT_CENTER_LATITUDE}
    default-zoom: ${URBAN_SAFE_MAP_DEFAULT_ZOOM}
    amap:
      js-api-key: ${URBAN_SAFE_AMAP_JS_API_KEY:}
      security-js-code: ${URBAN_SAFE_AMAP_SECURITY_JS_CODE:}
      service-host: ${URBAN_SAFE_AMAP_SERVICE_HOST}
      web-service-key: ${URBAN_SAFE_AMAP_WEB_SERVICE_KEY:}
      web-service-base-url: ${URBAN_SAFE_AMAP_WEB_SERVICE_BASE_URL}
      connect-timeout-ms: ${URBAN_SAFE_AMAP_CONNECT_TIMEOUT_MS}
      read-timeout-ms: ${URBAN_SAFE_AMAP_READ_TIMEOUT_MS}
      cache-ttl-seconds: ${URBAN_SAFE_AMAP_CACHE_TTL_SECONDS}
      live-test-enabled: ${URBAN_SAFE_AMAP_LIVE_TEST_ENABLED}
      boundary-candidate-enabled: ${URBAN_SAFE_AMAP_BOUNDARY_CANDIDATE_ENABLED:true}
  storage:
    provider: ${URBAN_SAFE_STORAGE_PROVIDER}
    endpoint: http://${URBAN_SAFE_MINIO_HOST}:${URBAN_SAFE_MINIO_API_PORT}
    access-key: ${URBAN_SAFE_MINIO_APP_USER}
    secret-key: ${URBAN_SAFE_MINIO_APP_PASSWORD}
    bucket: ${URBAN_SAFE_MINIO_ASSETS_BUCKET}
    local-directory: ${URBAN_SAFE_STORAGE_LOCAL_DIRECTORY}
    max-image-size-bytes: ${URBAN_SAFE_STORAGE_MAX_IMAGE_SIZE_BYTES}
    preview-expiry-seconds: ${URBAN_SAFE_STORAGE_PREVIEW_EXPIRY_SECONDS}
  ai:
    base-url: ${URBAN_SAFE_AI_SERVICE_BASE_URL:http://localhost:8001}
    connect-timeout-ms: ${URBAN_SAFE_AI_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${URBAN_SAFE_AI_READ_TIMEOUT_MS:15000}
    accuracy-read-timeout-ms: ${URBAN_SAFE_AI_ACCURACY_READ_TIMEOUT_MS:180000}
    default-mock-model-id: ${URBAN_SAFE_AI_DEFAULT_MOCK_MODEL_ID:AI-DEFECT-MOCK-001}
    default-mode: ${URBAN_SAFE_AI_DEFAULT_MODE:MOCK}
    orchestration:
      default-vision-provider: ${URBAN_SAFE_AI_DEFAULT_VISION_PROVIDER:FAST_API}
      default-workflow-provider: ${URBAN_SAFE_AI_DEFAULT_WORKFLOW_PROVIDER:DIFY}
      default-text-provider: ${URBAN_SAFE_AI_DEFAULT_TEXT_PROVIDER:SPRING_AI}
    execution:
      enabled: ${URBAN_SAFE_AI_EXECUTION_ENABLED:true}
      poll-delay-ms: ${URBAN_SAFE_AI_EXECUTION_POLL_DELAY_MS:1000}
      lease-seconds: ${URBAN_SAFE_AI_EXECUTION_LEASE_SECONDS:360}
      retry-base-delay-seconds: ${URBAN_SAFE_AI_EXECUTION_RETRY_BASE_DELAY_SECONDS:15}
      batch-size: ${URBAN_SAFE_AI_EXECUTION_BATCH_SIZE:2}
      worker-id: ${URBAN_SAFE_AI_EXECUTION_WORKER_ID:urban-safe-worker}
    dify:
      enabled: ${URBAN_SAFE_DIFY_ENABLED:false}
      base-url: ${URBAN_SAFE_DIFY_BASE_URL:https://api.dify.ai/v1}
      api-key: ${URBAN_SAFE_DIFY_API_KEY:}
      workflow-id: ${URBAN_SAFE_DIFY_WORKFLOW_ID:}
      workflow-version: ${URBAN_SAFE_DIFY_WORKFLOW_VERSION:image-analysis-v1.0.1}
      connect-timeout-ms: ${URBAN_SAFE_DIFY_CONNECT_TIMEOUT_MS:300000}
      read-timeout-ms: ${URBAN_SAFE_DIFY_READ_TIMEOUT_MS:300000}
      workflows:
        image-analysis:
          api-key: ${URBAN_SAFE_DIFY_IMAGE_ANALYSIS_API_KEY:${URBAN_SAFE_DIFY_API_KEY:}}
          app-id: ${URBAN_SAFE_DIFY_IMAGE_ANALYSIS_APP_ID:${URBAN_SAFE_DIFY_WORKFLOW_ID:}}
          version: ${URBAN_SAFE_DIFY_IMAGE_ANALYSIS_VERSION:${URBAN_SAFE_DIFY_WORKFLOW_VERSION:image-analysis-v1.0.1}}
        review-assist:
          api-key: ${URBAN_SAFE_DIFY_REVIEW_ASSIST_API_KEY:}
          app-id: ${URBAN_SAFE_DIFY_REVIEW_ASSIST_APP_ID:}
          version: ${URBAN_SAFE_DIFY_REVIEW_ASSIST_VERSION:review-assist-v1.0.0}
        report-draft:
          api-key: ${URBAN_SAFE_DIFY_REPORT_DRAFT_API_KEY:}
          app-id: ${URBAN_SAFE_DIFY_REPORT_DRAFT_APP_ID:}
          version: ${URBAN_SAFE_DIFY_REPORT_DRAFT_VERSION:report-draft-v1.0.0}
        knowledge-qa:
          api-key: ${URBAN_SAFE_DIFY_KNOWLEDGE_QA_API_KEY:}
          app-id: ${URBAN_SAFE_DIFY_KNOWLEDGE_QA_APP_ID:}
          version: ${URBAN_SAFE_DIFY_KNOWLEDGE_QA_VERSION:knowledge-qa-v1.0.0}
    spring-ai-provider:
      enabled: ${URBAN_SAFE_SPRING_AI_PROVIDER_ENABLED:false}
      provider-type: ${URBAN_SAFE_SPRING_AI_PROVIDER_TYPE:DEEPSEEK}
      api-key: ${URBAN_SAFE_SPRING_AI_API_KEY:}
      base-url: ${URBAN_SAFE_SPRING_AI_BASE_URL:https://api.deepseek.com}
      model: ${URBAN_SAFE_SPRING_AI_MODEL:deepseek-v4-flash}
      chat-model: ${URBAN_SAFE_SPRING_AI_MODEL_CHAT:none}
      connect-timeout-ms: ${URBAN_SAFE_SPRING_AI_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${URBAN_SAFE_SPRING_AI_READ_TIMEOUT_MS:30000}
