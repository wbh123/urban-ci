name: Sync Private Snapshot

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact urban-safe-priority commit SHA to mirror
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - '.ci-sync-source'

permissions:
  contents: write

concurrency:
  group: private-snapshot-sync
  cancel-in-progress: false

jobs:
  validate-and-publish:
    name: Validate private snapshot and publish ci-base
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DISPATCH_SOURCE_REF: ${{ inputs.source_ref }}
    steps:
      - name: Checkout public control files
        uses: actions/checkout@v4
        with:
          path: control
          ref: main
          fetch-depth: 1

      - name: Resolve exact private source commit
        shell: bash
        run: |
          set -euo pipefail
          source_ref="${DISPATCH_SOURCE_REF:-}"
          if [[ -z "$source_ref" ]]; then
            source_ref="$(tr -d '[:space:]' < control/.ci-sync-source)"
          fi
          source_ref="${source_ref,,}"
          if [[ ! "$source_ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_ref must be an exact 40-character commit SHA"
            exit 1
          fi
          echo "SOURCE_REF=$source_ref" >> "$GITHUB_ENV"
          echo "Validated requested source ref format: ${source_ref:0:12}"

      - name: Checkout private source repository
        uses: actions/checkout@v4
        with:
          repository: wbh123/urban-safe-priority
          ref: main
          token: ${{ secrets.URBAN_PRIVATE_REPO_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: true

      - name: Checkout and verify exact private source commit
        shell: bash
        run: |
          set -euo pipefail
          git -C private-source fetch --depth 1 origin "$SOURCE_REF"
          git -C private-source checkout --detach FETCH_HEAD
          actual="$(git -C private-source rev-parse HEAD)"
          if [[ "$actual" != "$SOURCE_REF" ]]; then
            echo "Requested private commit $SOURCE_REF but checked out $actual"
            exit 1
          fi
          echo "Validated private source commit: $actual"

      - name: Validate Wuhan competition data generators
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f scripts/dev/validate-wuhan-competition-generator.sh ]]; then
            bash scripts/dev/validate-wuhan-competition-generator.sh
          else
            echo "Legacy competition-generator validator is absent; running current showcase generator checks instead."
            bash -n scripts/dev/generate-showcase-data.sh
            python -m py_compile \
              scripts/dev/generate-showcase-data.py \
              scripts/dev/generate-showcase-data-cached.py \
              scripts/dev/enhance-showcase-diversity.py \
              scripts/dev/normalize-showcase-diversity-sql.py
            python -m unittest scripts.dev.tests.test_showcase_amap_cache
          fi

      - name: Build sanitized public mirror
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mirror

          common_excludes=(
            --exclude='.git/'
            --exclude='node_modules/'
            --exclude='dist/'
            --exclude='target/'
            --exclude='venv/'
            --exclude='.venv/'
            --exclude='__pycache__/'
            --exclude='.pytest_cache/'
            --exclude='.mypy_cache/'
            --exclude='*.md'
            --exclude='*.mdx'
            --exclude='*.doc'
            --exclude='*.docx'
            --exclude='*.pdf'
            --exclude='*.ppt'
            --exclude='*.pptx'
            --exclude='.env'
            --exclude='.env.local'
            --exclude='.env.*.local'
            --exclude='*.log'
            --exclude='*.pt'
            --exclude='*.pth'
            --exclude='*.onnx'
            --exclude='*.ckpt'
            --exclude='*.safetensors'
            --exclude='*.pkl'
            --exclude='*.joblib'
          )

          for dir in backend-java frontend ai-service-python docker scripts database; do
            if [[ -d "private-source/$dir" ]]; then
              mkdir -p "mirror/$dir"
              rsync -a --prune-empty-dirs "${common_excludes[@]}" \
                "private-source/$dir/" "mirror/$dir/"
            fi
          done

          if [[ -f private-source/.env.example ]]; then
            cp private-source/.env.example mirror/.env.example
          fi

          dify_src='private-source/docs/10_开发阶段/07_第七阶段/resources'
          dify_dst='mirror/docs/10_开发阶段/07_第七阶段/resources'
          if [[ -d "$dify_src" ]]; then
            mkdir -p "$dify_dst"
            find "$dify_src" -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) \
              -exec cp '{}' "$dify_dst/" \;
          fi

          mkdir -p mirror/.github/workflows
          cp control/.github/workflows/public-guard.yml mirror/.github/workflows/public-guard.yml
          cp control/.github/workflows/project-validation.yml mirror/.github/workflows/project-validation.yml
          cp control/.gitignore mirror/.gitignore
          printf '%s\n' "$SOURCE_REF" > mirror/.ci-source-sha

      - name: Enforce public mirror file policy before tests
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(find mirror -type f \( \
            -name '*.md' -o -name '*.mdx' -o -name '*.doc' -o -name '*.docx' -o \
            -name '*.pdf' -o -name '*.ppt' -o -name '*.pptx' -o -name 'AGENTS.md' -o \
            -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' -o \
            -name '*.jks' -o -name '*.keystore' -o -name '*.pt' -o -name '*.pth' -o \
            -name '*.onnx' -o -name '*.ckpt' -o -name '*.safetensors' \
          \) -print)"
          if [[ -n "$forbidden" ]]; then
            echo "Forbidden files found in public mirror:"
            printf '%s\n' "$forbidden"
            exit 1
          fi

          for root_dir in records downloads data; do
            if [[ -e "mirror/$root_dir" ]]; then
              echo "Forbidden private/runtime root path found: mirror/$root_dir"
              exit 1
            fi
          done

          patterns='-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9_-]{20,}'
          if grep -R -I -n -E "$patterns" \
              --exclude='package-lock.json' --exclude='*.lock' -- mirror; then
            echo "Potential secret material detected in public mirror."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mirror/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: mirror/frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee "$GITHUB_WORKSPACE/frontend-npm-ci.log"

      - name: Validate generated frontend API contract
        working-directory: mirror/frontend
        shell: bash
        run: |
          set -euo pipefail
          {
            npm run api:generate
            npm run api:check
          } 2>&1 | tee "$GITHUB_WORKSPACE/frontend-api.log"

      - name: Validate frontend TypeScript
        working-directory: mirror/frontend
        shell: bash
        run: |
          set -euo pipefail
          npm run type-check 2>&1 | tee "$GITHUB_WORKSPACE/frontend-typecheck.log"

      - name: Validate frontend tests
        working-directory: mirror/frontend
        shell: bash
        run: |
          set -euo pipefail
          npm run test 2>&1 | tee "$GITHUB_WORKSPACE/frontend-test.log"

      - name: Validate frontend production build
        working-directory: mirror/frontend
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee "$GITHUB_WORKSPACE/frontend-build.log"

      - name: Validate frontend lint
        working-directory: mirror/frontend
        shell: bash
        run: |
          set -euo pipefail
          npm run lint 2>&1 | tee "$GITHUB_WORKSPACE/frontend-lint.log"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: mirror/backend-java/pom.xml

      - name: Validate backend
        working-directory: mirror/backend-java
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .mvn
          cat > .mvn/settings.xml <<'SETTINGS_EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.2.0 https://maven.apache.org/xsd/settings-1.2.0.xsd" />
          SETTINGS_EOF
          set +e
          mvn -B -ntp test 2>&1 | tee "$GITHUB_WORKSPACE/backend-validation.log"
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: mirror/ai-service-python/requirements.txt

      - name: Validate Python AI service
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r mirror/ai-service-python/requirements.txt
          cd mirror/ai-service-python
          python -m compileall -q app modeling training tools
          python -m tools.model_pipeline --help >/dev/null
          pytest -q
          cd ..
          python -m unittest scripts/ai/tests/test_evaluate_phase7_validation.py
          python -m unittest scripts/ai/tests/test_phase7_workflow_dsl.py

      - name: Publish validated snapshot to ci-base
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code "$remote_url" refs/heads/ci-base >/dev/null 2>&1; then
            git clone --depth 1 --branch ci-base "$remote_url" publish
            rsync -a --delete --exclude='.git/' mirror/ publish/
            cd publish
            git config user.name 'urban-ci-bot'
            git config user.email 'urban-ci-bot@users.noreply.github.com'
            git add -A
            if git diff --cached --quiet; then
              echo "Validated snapshot is unchanged; ci-base already matches source."
            else
              git commit -m "ci: validated snapshot ${SOURCE_REF:0:12}"
              git push origin HEAD:ci-base
            fi
          else
            cd mirror
            git init
            git config user.name 'urban-ci-bot'
            git config user.email 'urban-ci-bot@users.noreply.github.com'
            git checkout --orphan ci-base
            git add -A
            git commit -m "ci: validated snapshot ${SOURCE_REF:0:12}"
            git remote add origin "$remote_url"
            git push origin HEAD:ci-base
          fi

      - name: Record synchronization result
        if: always()
        shell: bash
        env:
          SYNC_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          cd control
          git pull --rebase origin main
          source_ref="${SOURCE_REF:-unknown}"
          cat > .ci-sync-result <<EOF_RESULT
          source_ref=$source_ref
          status=$SYNC_STATUS
          run_id=$GITHUB_RUN_ID
          run_attempt=$GITHUB_RUN_ATTEMPT
          trigger_commit=$GITHUB_SHA
          EOF_RESULT

          frontend_logs=(
            ../frontend-npm-ci.log
            ../frontend-api.log
            ../frontend-typecheck.log
            ../frontend-test.log
            ../frontend-build.log
            ../frontend-lint.log
          )
          has_frontend_log=false
          for log in "${frontend_logs[@]}"; do
            if [[ -f "$log" ]]; then
              has_frontend_log=true
              break
            fi
          done
          if [[ "$SYNC_STATUS" != "success" && "$has_frontend_log" == "true" ]]; then
            {
              echo "source_ref=$source_ref"
              echo "run_id=$GITHUB_RUN_ID"
              for log in "${frontend_logs[@]}"; do
                if [[ -f "$log" ]]; then
                  echo "--- $(basename "$log") tail ---"
                  tail -n 180 "$log"
                fi
              done
            } > .ci-frontend-diagnostic
          else
            rm -f .ci-frontend-diagnostic
          fi

          if [[ "$SYNC_STATUS" != "success" && -f ../backend-validation.log ]]; then
            {
              echo "source_ref=$source_ref"
              echo "run_id=$GITHUB_RUN_ID"
              echo "--- Maven tail ---"
              tail -n 240 ../backend-validation.log
              echo "--- Surefire summaries ---"
              find ../mirror/backend-java -path '*/surefire-reports/*.txt' -type f -print0 2>/dev/null \
                | sort -z \
                | xargs -0 -r grep -H -E 'Tests run:|FAILURE|ERROR|Caused by:' || true
            } > .ci-backend-diagnostic
          else
            rm -f .ci-backend-diagnostic
          fi

          git config user.name 'urban-ci-bot'
          git config user.email 'urban-ci-bot@users.noreply.github.com'
          git add .ci-sync-result .ci-frontend-diagnostic .ci-backend-diagnostic 2>/dev/null || \
            git add -u .ci-sync-result .ci-frontend-diagnostic .ci-backend-diagnostic
          if ! git diff --cached --quiet; then
            git commit -m "ci: record private snapshot sync $SYNC_STATUS"
            git push origin HEAD:main
          fi